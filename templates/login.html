{# 此文件仅作为后备，login 已合并到 dashboard.html #}
{% if not session.logged_in %}
<div class="login-container">
  <div class="login-card glass-card">
    <h2 class="login-title"><i class="fas fa-shield-alt"></i> ورود به سیستم</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">نام کاربری</label>
        <input type="text" name="username" class="form-control ltr-input" required>
      </div>
      <div class="mb-3 position-relative">
        <label class="form-label">رمز عبور</label>
        <input type="password" name="password" class="form-control ltr-input" required id="password">
        <button type="button" class="btn btn-sm btn-outline-secondary position-absolute" style="left: 10px; bottom: 5px;" onclick="togglePassword()">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <button type="submit" class="btn btn-primary w-100">ورود</button>
    </form>
  </div>
</div>
{% endif %}
