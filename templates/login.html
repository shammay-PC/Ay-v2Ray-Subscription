<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به Ay-Custom-Sub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        body {
            font-family: Vazirmatn, sans-serif;
            background: linear-gradient(135deg, #2196f3 0%, #1e1e2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .login-card h2 {
            color: #1e1e2d;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-control {
            height: 48px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 0 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33,150,243,0.15);
        }
        .btn-login {
            background: #2196f3;
            border: none;
            height: 48px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: #1976d2;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #dc3545;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fas fa-shield-alt me-2"></i>Ay Custom Sub</h2>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}">
            <div class="mb-3">
                <input type="text" name="username" class="form-control"
                       placeholder="نام کاربری" required dir="ltr">
            </div>
            <div class="mb-4 position-relative">
                <input type="password" name="password" id="password"
                       class="form-control" placeholder="رمز عبور" required dir="ltr">
                <button type="button"
                        class="btn btn-link position-absolute end-0 top-50 translate-middle-y"
                        onclick="togglePw()" style="text-decoration:none; color:#94a3b8;">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-1"></i> ورود
            </button>
        </form>
    </div>
    <script>
        function togglePw() {
            const p = document.getElementById('password');
            const i = document.getElementById('eyeIcon');
            if (p.type === 'password') {
                p.type = 'text';
                i.className = 'fas fa-eye-slash';
            } else {
                p.type = 'password';
                i.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
